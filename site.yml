---
- name: Full dotfiles setup
  hosts: local
  gather_facts: true

  pre_tasks:
    - name: Ensure ansible collections are installed
      ansible.builtin.command:
        cmd: ansible-galaxy collection install -r requirements.yml
      delegate_to: localhost
      run_once: true
      changed_when: false
      when: install_ansible_collections | default(false) | bool

  roles:
    - role: common
      tags: [common, bootstrap]

    - role: packages
      tags: [packages, bootstrap]

    - role: mise
      tags: [mise, tools]

    - role: ssh
      tags: [ssh, secrets]

    - role: gpg
      tags: [gpg, secrets]

    - role: secrets
      tags: [secrets]

    - role: chezmoi
      tags: [chezmoi, dotfiles]

    - role: external
      tags: [external]

    - role: macos
      tags: [macos]
      when: ansible_facts['os_family'] == "Darwin"

    - role: tailscale
      tags: [tailscale, network]
