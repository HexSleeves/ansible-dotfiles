---
- name: Full dotfiles setup
  hosts: local
  gather_facts: true

  pre_tasks:
    - name: Ensure ansible collections are installed
      ansible.builtin.command:
        cmd: ansible-galaxy collection install -r requirements.yml
      delegate_to: localhost
      run_once: true
      changed_when: false
      when: install_ansible_collections | default(false) | bool

    - name: Check vault password is reachable
      ansible.builtin.command:
        cmd: "{{ playbook_dir }}/.vault-password-op.sh"
      delegate_to: localhost
      run_once: true
      changed_when: false
      register: _vault_check
      failed_when: false

    - name: Warn if vault password is unreachable
      ansible.builtin.debug:
        msg: >-
          Vault password is not available — roles tagged 'secrets'
          (ssh, gpg, secrets) will fail. Bootstrap first with
          --tags bootstrap to install 1Password CLI and Homebrew,
          then re-run the full playbook.
      when:
        - _vault_check.rc | default(0) != 0

    - name: Detect macOS architecture for brew prefix
      ansible.builtin.set_fact:
        macos_arch: "{{ ansible_facts['architecture'] }}"
        brew_prefix: "{{ '/opt/homebrew' if ansible_facts['architecture'] == 'arm64' else '/usr/local' }}"
      when: ansible_facts['os_family'] == "Darwin"

  roles:
    - role: common
      tags: [common, bootstrap]

    - role: packages
      tags: [packages, bootstrap]

    - role: mise
      tags: [mise, tools]

    - role: ssh
      tags: [ssh, secrets]

    - role: gpg
      tags: [gpg, secrets]

    - role: secrets
      tags: [secrets]

    - role: chezmoi
      tags: [chezmoi, dotfiles]

    - role: external
      tags: [external]

    - role: distrobox
      tags: [distrobox]
      when: ansible_facts['os_family'] != "Darwin"

    - role: macos
      tags: [macos]
      when: ansible_facts['os_family'] == "Darwin"

    - role: tailscale
      tags: [tailscale, network]

  post_tasks:
    # Re-render chezmoi config if template changed (e.g. after git update or
    # newly-applied dotfiles changed the template). This avoids the
    # "config file template has changed" warning on subsequent runs.
    - name: Re-render chezmoi config if needed
      ansible.builtin.shell:
        cmd: |
          if chezmoi init --no-tty 2>/dev/null; then
            echo "chezmoi config re-rendered"
          else
            echo "chezmoi init skipped (not yet initialized)"
          fi
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
      tags: [chezmoi, dotfiles]
