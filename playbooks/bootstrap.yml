---
# First-time machine setup
- name: Bootstrap new machine
  hosts: local
  gather_facts: true

  roles:
    - role: common
    - role: packages
    - role: mise
    - role: ssh
    - role: gpg
    - role: chezmoi
    - role: secrets
    - role: external
    - role: macos
      when: ansible_facts['os_family'] == "Darwin"
    - role: tailscale
