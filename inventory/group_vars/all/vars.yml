---
# Chezmoi dotfiles repo
chezmoi_repo: "git@github.com:HexSleeves/dotfiles.git"

# Identity
user_name: "Jacob LeCoq"
user_email: "lecoqjacob@gmail.com"
personal_email: "lecoqjacob@gmail.com"
bayer_email: "jacob.lecoq.ext@bayer.com"
liatrio_email: "jacob.lecoq@liatrio.com"
github_user: "HexSleeves"
signing_key: "758709BBEB67145DE844FC85C61F052D671268B5"

# XDG base dirs
_home: "{{ lookup('env', 'HOME') }}"
xdg_config_home: "{{ _home }}/.config"
xdg_data_home: "{{ _home }}/.local/share"
xdg_cache_home: "{{ _home }}/.cache"
xdg_state_home: "{{ _home }}/.local/state"
local_bin: "{{ _home }}/.local/bin"

# Machine class — override per host/group
machine_class: "Personal"

# macOS sudo configuration
macos_touchid_sudo: false
macos_nopasswd_sudo: true

# Language versions
python_version: "3.14"
mongodb_version: "7.0"

# Mise runtimes (all profiles)
mise_core_tools:
  - name: node
    version: lts
  - name: python
    version: latest
  - name: golang
    version: latest
  - name: deno
    version: latest
  - name: bun
    version: latest

# Mise runtimes (personal only)
mise_personal_tools:
  - name: cargo-binstall
    version: latest
  - name: lua
    version: latest
  - name: neovim
    version: latest
  - name: yamlfmt
    version: latest

# Cargo tools installed via cargo-binstall (personal only)
cargo_tools:
  - bat
  - ripgrep
  - fd-find
  - eza
  - zoxide
  - starship
  - bottom
  - tokei

# NPM global tools (personal only)
npm_global_tools:
  - typescript
  - ts-node
  - neovim


# External git repos
external_repos:
  - repo: "https://github.com/HexSleeves/nvim.git"
    dest: "{{ xdg_config_home }}/nvim"
  - repo: "https://github.com/HexSleeves/zdotdir.git"
    dest: "{{ xdg_config_home }}/zsh"
