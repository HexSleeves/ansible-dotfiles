---
- name: Create shell config dir
  ansible.builtin.file:
    path: "{{ xdg_config_home }}/shell"
    state: directory
    mode: "0755"

- name: Copy shell dotfiles to home
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ _home }}/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: zshrc,       dest: .zshrc }
    - { src: zshenv,      dest: .zshenv }
    - { src: zprofile,    dest: .zprofile }
    - { src: profile,     dest: .profile }
    - { src: bashrc,      dest: .bashrc }
    - { src: bash_profile, dest: .bash_profile }
    - { src: fzf.zsh,     dest: .fzf.zsh }
    - { src: fzf.bash,    dest: .fzf.bash }

- name: Copy ~/.config/shell/ files
  ansible.builtin.copy:
    src: "shell/"
    dest: "{{ xdg_config_home }}/shell/"
    mode: "0644"

- name: Create zsh config dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ xdg_config_home }}/zsh"
    - "{{ xdg_cache_home }}/zsh"
    - "{{ xdg_data_home }}/zsh"

- name: Template zsh environment files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - src: zshenv.j2
      dest: "{{ xdg_config_home }}/zsh/.zshenv"
    - src: zprofile.j2
      dest: "{{ xdg_config_home }}/zsh/.zprofile"
