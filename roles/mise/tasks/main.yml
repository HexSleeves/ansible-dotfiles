---
- name: Check if mise is installed
  ansible.builtin.stat:
    path: "{{ local_bin }}/mise"
  register: mise_binary

- name: Download mise installer
  ansible.builtin.get_url:
    url: https://mise.run
    dest: /tmp/mise-install.sh
    mode: "0755"
  when: not mise_binary.stat.exists

- name: Install mise
  ansible.builtin.command:
    cmd: /tmp/mise-install.sh
    creates: "{{ local_bin }}/mise"
  environment:
    MISE_INSTALL_PATH: "{{ local_bin }}/mise"
  when: not mise_binary.stat.exists

- name: Install mise core tools
  ansible.builtin.command:
    cmd: "{{ local_bin }}/mise use --global {{ item.name }}@{{ item.version }}"
  loop: "{{ mise_core_tools }}"
  register: mise_install
  changed_when: "'installed' in mise_install.stdout | lower"

- name: Install mise personal tools
  ansible.builtin.command:
    cmd: "{{ local_bin }}/mise use --global {{ item.name }}@{{ item.version }}"
  loop: "{{ mise_personal_tools }}"
  when: machine_class | default('Personal') == "Personal"
  register: mise_personal_install
  changed_when: "'installed' in mise_personal_install.stdout | lower"

- name: Install cargo-binstall
  ansible.builtin.command:
    cmd: "{{ local_bin }}/mise exec rust -- cargo install cargo-binstall"
    creates: "{{ _home }}/.cargo/bin/cargo-binstall"
  when: machine_class | default('Personal') == "Personal"

- name: Install cargo tools via cargo-binstall
  ansible.builtin.command:
    cmd: "{{ _home }}/.cargo/bin/cargo binstall --no-confirm --quiet {{ item }}"
  loop: "{{ cargo_tools }}"
  when: machine_class | default('Personal') == "Personal"
  register: mise_cargo_install
  changed_when: mise_cargo_install.rc == 0
  failed_when: false

- name: Install NPM global tools
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: present
  loop: "{{ npm_global_tools }}"
  when: machine_class | default('Personal') == "Personal"
