---
# Taps that need explicit trust before formulas can be installed from them.
packages_brew_taps:
  - antoniorodr/memo
  - boldsoftware/tap
  - cloudfoundry-community/cf
  - hashicorp/tap
  - steipete/tap
  - yakitrak/yakitrak

packages_apt_bootstrap_packages:
  - build-essential
  - curl
  - distrobox
  - git
  - procps
  - file

packages_pacman_bootstrap_packages:
  - base-devel
  - curl
  - git

packages_dnf_bootstrap_packages:
  - gcc
  - gcc-c++
  - make
  - curl
  - git
