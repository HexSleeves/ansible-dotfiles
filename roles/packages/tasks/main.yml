---
# Bootstrap: minimal native packages Homebrew itself needs
- name: Install build dependencies (Debian/Ubuntu)
  become: true
  ansible.builtin.apt:
    name: "{{ apt_bootstrap_packages }}"
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"
  tags: [packages, bootstrap]

- name: Install build dependencies (Arch)
  become: true
  community.general.pacman:
    name: "{{ pacman_bootstrap_packages }}"
    state: present
    update_cache: true
  when: ansible_facts['distribution'] in ["Archlinux", "Arch Linux", "EndeavourOS", "Manjaro"]
  tags: [packages, bootstrap]

- name: Install build dependencies (RHEL/Fedora)
  become: true
  ansible.builtin.dnf:
    name: "{{ dnf_bootstrap_packages }}"
    state: present
  when: ansible_facts['os_family'] == "RedHat"
  tags: [packages, bootstrap]

# Homebrew: primary package manager on both macOS and Linux
- name: Install Homebrew (macOS)
  ansible.builtin.shell:
    cmd: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    creates: /opt/homebrew/bin/brew
  environment:
    NONINTERACTIVE: "1"
  when: ansible_facts['os_family'] == "Darwin"
  tags: [packages, bootstrap]

- name: Install Homebrew (Linux)
  ansible.builtin.shell:
    cmd: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    creates: /home/linuxbrew/.linuxbrew/bin/brew
  environment:
    NONINTERACTIVE: "1"
  when: ansible_facts['os_family'] != "Darwin"
  tags: [packages, bootstrap]

- name: Run brew bundle
  ansible.builtin.command:
    cmd: brew bundle --file={{ role_path }}/files/Brewfile --no-lock
  register: brew_bundle
  changed_when: "'Installing' in brew_bundle.stdout or 'Upgrading' in brew_bundle.stdout"
  environment:
    PATH: "/home/linuxbrew/.linuxbrew/bin:/opt/homebrew/bin:{{ ansible_env.PATH }}"
  tags: [packages]
