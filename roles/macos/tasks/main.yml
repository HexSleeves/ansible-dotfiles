---
# All tasks in this role are macOS-only.
# Role-level when is set in site.yml; individual task whens are omitted.

- name: Enable TouchID for sudo
  ansible.builtin.lineinfile:
    path: /etc/pam.d/sudo_local
    line: "auth       sufficient     pam_tid.so"
    create: true
    mode: "0644"
  become: true
  when: macos_touchid_sudo | default(true) | bool

- name: Disable TouchID for sudo
  ansible.builtin.lineinfile:
    path: /etc/pam.d/sudo_local
    regexp: '^auth\s+sufficient\s+pam_tid\.so'
    line: "# auth       sufficient     pam_tid.so"
    mode: "0644"
  become: true
  when: not (macos_touchid_sudo | default(true) | bool)

- name: Remove stray TouchID line from /etc/pam.d/sudo
  ansible.builtin.lineinfile:
    path: /etc/pam.d/sudo
    regexp: '^auth\s+sufficient\s+pam_tid\.so'
    state: absent
  become: true
  when: not (macos_touchid_sudo | default(true) | bool)

- name: Configure passwordless sudo
  ansible.builtin.lineinfile:
    path: "/etc/sudoers.d/{{ ansible_facts['env']['USER'] }}-nopasswd"
    line: "{{ ansible_facts['env']['USER'] }} ALL=(ALL) NOPASSWD: ALL"
    create: true
    mode: "0440"
    validate: "visudo -cf %s"
  become: true
  when: macos_nopasswd_sudo | default(false) | bool

- name: Remove passwordless sudo
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ ansible_facts['env']['USER'] }}-nopasswd"
    state: absent
  become: true
  when: not (macos_nopasswd_sudo | default(false) | bool)

- name: Check Spotlight indexing status for ~/Developer
  ansible.builtin.command:
    cmd: mdutil -s "{{ _home }}/Developer"
  become: true
  register: macos_spotlight_status
  changed_when: false
  failed_when: false

- name: Disable Spotlight indexing for ~/Developer
  ansible.builtin.command:
    cmd: mdutil -i off "{{ _home }}/Developer"
  become: true
  when: "'Indexing enabled' in macos_spotlight_status.stdout"
  changed_when: true

- name: Check macOS firewall SSH application entry
  ansible.builtin.command:
    cmd: /usr/libexec/ApplicationFirewall/socketfilterfw --listapps
  become: true
  register: macos_firewall_apps
  changed_when: false
  failed_when: false

- name: Allow SSH through macOS firewall
  ansible.builtin.command:
    cmd: /usr/libexec/ApplicationFirewall/socketfilterfw --add /usr/sbin/sshd
  become: true
  when: "'/usr/sbin/sshd' not in macos_firewall_apps.stdout"
  changed_when: true

- name: Apply macOS system defaults
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
  loop: "{{ macos_defaults }}"
  notify: Restart affected macOS services
