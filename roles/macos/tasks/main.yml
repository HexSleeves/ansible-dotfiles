---
# All tasks in this role are macOS-only.
# Role-level when is set in site.yml; individual task whens are omitted.

- name: Enable TouchID for sudo
  ansible.builtin.lineinfile:
    path: /etc/pam.d/sudo_local
    line: "auth       sufficient     pam_tid.so"
    create: true
    mode: "0644"
  become: true

- name: Check Spotlight indexing status for ~/Developer
  ansible.builtin.command:
    cmd: mdutil -s "{{ _home }}/Developer"
  become: true
  register: macos_spotlight_status
  changed_when: false
  failed_when: false

- name: Disable Spotlight indexing for ~/Developer
  ansible.builtin.command:
    cmd: mdutil -i off "{{ _home }}/Developer"
  become: true
  when: "'Indexing enabled' in macos_spotlight_status.stdout"
  changed_when: true

- name: Check macOS firewall SSH application entry
  ansible.builtin.command:
    cmd: /usr/libexec/ApplicationFirewall/socketfilterfw --listapps
  become: true
  register: macos_firewall_apps
  changed_when: false
  failed_when: false

- name: Allow SSH through macOS firewall
  ansible.builtin.command:
    cmd: /usr/libexec/ApplicationFirewall/socketfilterfw --add /usr/sbin/sshd
  become: true
  when: "'/usr/sbin/sshd' not in macos_firewall_apps.stdout"
  changed_when: true

- name: Apply macOS system defaults
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
  loop: "{{ macos_defaults }}"
  notify: Restart affected macOS services
