---
# All tasks in this role are macOS-only.
# Role-level when is set in site.yml; individual task whens are omitted.

- name: Enable TouchID for sudo
  ansible.builtin.lineinfile:
    path: /etc/pam.d/sudo_local
    line: "auth       sufficient     pam_tid.so"
    create: true
    mode: "0644"
  become: true

- name: Disable Spotlight indexing for ~/Developer
  ansible.builtin.command:
    cmd: mdutil -i off ~/Developer
  become: true
  changed_when: true

- name: Allow SSH through macOS firewall
  ansible.builtin.command:
    cmd: /usr/libexec/ApplicationFirewall/socketfilterfw --add /usr/sbin/sshd
  become: true
  changed_when: true

- name: Apply macOS system defaults
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
  loop: "{{ macos_defaults }}"

- name: Restart affected macOS services
  ansible.builtin.command:
    cmd: "killall {{ item }}"
  loop:
    - Finder
    - Dock
    - SystemUIServer
  failed_when: false
  changed_when: true
