---
- name: Create XDG base directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ xdg_config_home }}"
    - "{{ xdg_data_home }}"
    - "{{ xdg_cache_home }}"
    - "{{ xdg_state_home }}"
    - "{{ local_bin }}"
    - "{{ ansible_env.HOME }}/.ssh/sockets"

- name: Set SSH sockets dir permissions
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh/sockets"
    mode: "0700"

- name: Install base packages (Debian/Ubuntu)
  become: true
  ansible.builtin.apt:
    name: "{{ common_debian_packages }}"
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install base packages (Arch)
  become: true
  community.general.pacman:
    name: "{{ common_arch_packages }}"
    state: present
  when: ansible_distribution in ["Archlinux", "Arch Linux", "EndeavourOS", "Manjaro"]

- name: Install base packages (RHEL/Fedora)
  become: true
  ansible.builtin.dnf:
    name: "{{ common_rhel_packages }}"
    state: present
  when: ansible_os_family == "RedHat"
