---
- name: Install chezmoi (Linux)
  ansible.builtin.shell:
    cmd: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "{{ local_bin }}"
    creates: "{{ local_bin }}/chezmoi"
  when: ansible_facts['os_family'] != "Darwin"

- name: Check if chezmoi source dir exists
  ansible.builtin.stat:
    path: "{{ xdg_data_home }}/chezmoi"
  register: _chezmoi_src

- name: Initialize and apply chezmoi
  ansible.builtin.command:
    cmd: chezmoi init --apply "{{ chezmoi_repo }}"
  when:
    - chezmoi_repo | length > 0
    - not _chezmoi_src.stat.exists
  changed_when: true

- name: Update chezmoi
  ansible.builtin.command:
    cmd: chezmoi update --no-tty
  when:
    - chezmoi_repo | length > 0
    - _chezmoi_src.stat.exists
  changed_when: true
