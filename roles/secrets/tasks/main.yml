---
# Deploy all vault-encrypted application configs.
# Each vault_* variable is an ansible-vault encrypted string.
# No plaintext secrets are ever written to the repo.

- name: Create Claude config dir
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.claude"
    state: directory
    mode: "0700"

- name: Deploy Claude settings
  ansible.builtin.copy:
    content: "{{ vault_claude_settings }}"
    dest: "{{ ansible_env.HOME }}/.claude/settings.json"
    mode: "0600"
  when: vault_claude_settings | length > 0
  no_log: true

- name: Deploy Claude config
  ansible.builtin.copy:
    content: "{{ vault_claude_config }}"
    dest: "{{ ansible_env.HOME }}/.claude.json"
    mode: "0600"
  when: vault_claude_config | length > 0
  no_log: true

- name: Copy Claude non-secret files
  ansible.builtin.copy:
    src: claude/
    dest: "{{ ansible_env.HOME }}/.claude/"
    mode: preserve

- name: Create Codex config dir
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.codex"
    state: directory
    mode: "0700"

- name: Deploy Codex config
  ansible.builtin.copy:
    content: "{{ vault_codex_config }}"
    dest: "{{ ansible_env.HOME }}/.codex/config.toml"
    mode: "0600"
  when: vault_codex_config | length > 0
  no_log: true

- name: Copy Codex non-secret files
  ansible.builtin.copy:
    src: codex/
    dest: "{{ ansible_env.HOME }}/.codex/"
    mode: preserve

- name: Create Cursor config dir
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.cursor"
    state: directory
    mode: "0755"

- name: Deploy Cursor MCP config
  ansible.builtin.copy:
    content: "{{ vault_cursor_mcp }}"
    dest: "{{ ansible_env.HOME }}/.cursor/mcp.json"
    mode: "0600"
  when: vault_cursor_mcp | length > 0
  no_log: true

- name: Copy Cursor non-secret files
  ansible.builtin.copy:
    src: cursor/
    dest: "{{ ansible_env.HOME }}/.cursor/"
    mode: preserve

- name: Create NPM config dir
  ansible.builtin.file:
    path: "{{ xdg_config_home }}/npm"
    state: directory
    mode: "0755"

- name: Deploy NPM token
  ansible.builtin.copy:
    content: "{{ vault_npm_token }}"
    dest: "{{ xdg_config_home }}/npm/npmrc"
    mode: "0600"
  when: vault_npm_token | length > 0
  no_log: true

- name: Create Raycast config dir
  ansible.builtin.file:
    path: "{{ xdg_config_home }}/raycast"
    state: directory
    mode: "0755"

- name: Deploy Raycast config
  ansible.builtin.copy:
    content: "{{ vault_raycast_config }}"
    dest: "{{ xdg_config_home }}/raycast/config.json"
    mode: "0600"
  when: vault_raycast_config | length > 0
  no_log: true

- name: Create OpenCode config dir
  ansible.builtin.file:
    path: "{{ xdg_config_home }}/opencode"
    state: directory
    mode: "0755"

- name: Deploy OpenCode config
  ansible.builtin.copy:
    content: "{{ vault_opencode_config }}"
    dest: "{{ xdg_config_home }}/opencode/opencode.jsonc"
    mode: "0600"
  when: vault_opencode_config | length > 0
  no_log: true
