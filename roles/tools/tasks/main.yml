---
- name: Deploy ~/.config tool directories
  ansible.builtin.copy:
    src: "config/{{ item }}/"
    dest: "{{ xdg_config_home }}/{{ item }}/"
    mode: preserve
  loop:
    - broot
    - ccstatusline
    - gh
    - ghostty
    - htop
    - jq
    - lazygit
    - mise
    - sage
    - tmux
    - zed
    - zellij
    - dotfiles
    - justfiles

- name: Deploy single-file configs
  ansible.builtin.copy:
    src: "config/{{ item.src }}"
    dest: "{{ xdg_config_home }}/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: fzfrc,        dest: fzfrc }
    - { src: topgrade.toml, dest: topgrade.toml }
    - { src: local-ai.env, dest: local-ai.env }

- name: Deploy systemd user services
  ansible.builtin.copy:
    src: "config/systemd/"
    dest: "{{ xdg_config_home }}/systemd/"
    mode: preserve
  when: ansible_os_family != "Darwin"

- name: Reload systemd user daemon
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  when: ansible_os_family != "Darwin"

- name: Deploy ~/.pilot config
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.pilot"
    state: directory
    mode: "0755"

- name: Copy pilot config
  ansible.builtin.copy:
    src: pilot/
    dest: "{{ ansible_env.HOME }}/.pilot/"
    mode: "0644"

- name: Deploy justfile
  ansible.builtin.copy:
    src: justfile
    dest: "{{ ansible_env.HOME }}/justfile"
    mode: "0644"

- name: Deploy ~/.local/bin scripts
  ansible.builtin.copy:
    src: "local_bin/{{ item | basename }}"
    dest: "{{ local_bin }}/{{ item | basename | regex_replace('^executable_', '') }}"
    mode: "0755"
  with_fileglob:
    - "{{ role_path }}/files/local_bin/executable_*"

- name: Deploy AWS config
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.aws"
    state: directory
    mode: "0700"

- name: Copy AWS config
  ansible.builtin.copy:
    src: aws/private_config
    dest: "{{ ansible_env.HOME }}/.aws/config"
    mode: "0600"
