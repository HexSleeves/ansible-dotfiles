---
- name: Check if Tailscale is installed
  ansible.builtin.command:
    cmd: which tailscale
  register: tailscale_check
  changed_when: false
  failed_when: false
  tags: [packages, bootstrap]

- name: Install Tailscale (macOS)
  community.general.homebrew:
    name: tailscale
    state: present
  when:
    - ansible_facts['os_family'] == "Darwin"
    - tailscale_check.rc | default(1) != 0
  tags: [packages, bootstrap]

- name: Add Tailscale apt repo (Debian/Ubuntu)
  tags: [packages, bootstrap]
  when:
    - ansible_facts['os_family'] == "Debian"
    - tailscale_check.rc | default(1) != 0
  block:
    - name: Add Tailscale GPG key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"
      become: true

    - name: Add Tailscale repository
      ansible.builtin.deb822_repository:
        name: tailscale
        types:
          - deb
        uris:
          - "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}"
        suites:
          - "{{ ansible_facts['distribution_release'] }}"
        components:
          - main
        signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
        state: present
      become: true

    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true
      become: true

- name: Enable and start tailscaled (Linux)
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  become: true
  when:
    - ansible_facts['os_family'] != "Darwin"
    - tailscale_check.rc | default(1) != 0
  tags: [packages, bootstrap]
