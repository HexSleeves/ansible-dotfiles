---
- name: Check if Tailscale is installed
  ansible.builtin.command:
    cmd: which tailscale
  register: tailscale_check
  changed_when: false
  failed_when: false

- name: Install Tailscale (macOS)
  community.general.homebrew:
    name: tailscale
    state: present
  when:
    - ansible_facts['os_family'] == "Darwin"
    - tailscale_check.rc != 0

- name: Add Tailscale apt repo (Debian/Ubuntu)
  when:
    - ansible_facts['os_family'] == "Debian"
    - tailscale_check.rc != 0
  block:
    - name: Add Tailscale GPG key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"
      become: true

    - name: Add Tailscale repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }} {{ ansible_facts['distribution_release'] }} main"
        state: present
      become: true

    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true
      become: true
  tags: [packages, bootstrap]

- name: Enable and start tailscaled (Linux)
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  become: true
  when:
    - ansible_facts['os_family'] != "Darwin"
    - tailscale_check.rc != 0
