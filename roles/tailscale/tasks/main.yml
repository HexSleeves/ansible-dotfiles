---
- name: Install Tailscale (macOS)
  community.general.homebrew:
    name: tailscale
    state: present
  when: ansible_os_family == "Darwin"

- name: Add Tailscale apt repo (Debian/Ubuntu)
  when: ansible_os_family == "Debian"
  block:
    - name: Add Tailscale GPG key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"
      become: true

    - name: Add Tailscale repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} main"
        state: present
      become: true

    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true
      become: true

- name: Enable and start tailscaled (Linux)
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  become: true
  when: ansible_os_family != "Darwin"
