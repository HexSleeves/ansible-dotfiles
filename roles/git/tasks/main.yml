---
- name: Create git config dir
  ansible.builtin.file:
    path: "{{ xdg_config_home }}/git"
    state: directory
    mode: "0755"

- name: Template git config
  ansible.builtin.template:
    src: config.j2
    dest: "{{ xdg_config_home }}/git/config"
    mode: "0644"

- name: Copy static git files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ xdg_config_home }}/git/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: themes.gitconfig, dest: themes.gitconfig }
    - { src: ignore,           dest: ignore }

- name: Create git config.local if absent
  ansible.builtin.copy:
    content: "# Local git config overrides — not tracked in git\n"
    dest: "{{ xdg_config_home }}/git/config.local"
    force: false
    mode: "0644"
