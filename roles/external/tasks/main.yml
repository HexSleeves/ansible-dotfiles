---
- name: Clone external git repos
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ item.dest }}"
    update: "{{ external_repos_update | default(false) }}"
    version: "{{ item.version | default('HEAD') }}"
  loop: "{{ external_repos }}"

- name: Check if glow already installed
  ansible.builtin.stat:
    path: "{{ local_bin }}/glow"
  register: external_glow_bin

- name: Download glow binary (Linux x86_64)
  ansible.builtin.get_url:
    url: "https://github.com/charmbracelet/glow/releases/download/v2.1.2/glow_2.1.2_Linux_x86_64.tar.gz"
    dest: /tmp/glow.tar.gz
    checksum: sha256:6063d4f2af8a82a5f4bba0831e165de9381660aa8b41df4816d0106a265b07d5
    mode: "0644"
  when:
    - ansible_facts["os_family"] != "Darwin"
    - ansible_facts["architecture"] == "x86_64"
    - not external_glow_bin.stat.exists

- name: Extract glow binary (Linux)
  ansible.builtin.unarchive:
    src: /tmp/glow.tar.gz
    dest: "{{ local_bin }}"
    include: glow
    remote_src: true
  when:
    - ansible_facts["os_family"] != "Darwin"
    - ansible_facts["architecture"] == "x86_64"
    - not external_glow_bin.stat.exists

- name: Check if Monaspace fonts installed
  ansible.builtin.stat:
    path: "{{ xdg_data_home }}/fonts/Monaspace"
  register: external_monaspace_dir

- name: Download Monaspace fonts (Linux)
  ansible.builtin.get_url:
    url: "https://github.com/githubnext/monaspace/releases/download/v1.400/monaspace-v1.400.zip"
    dest: /tmp/monaspace.zip
    mode: "0644"
  when:
    - ansible_facts["os_family"] != "Darwin"
    - not external_monaspace_dir.stat.exists

- name: Create fonts dir
  ansible.builtin.file:
    path: "{{ xdg_data_home }}/fonts/Monaspace"
    state: directory
    mode: "0755"
  when:
    - ansible_facts["os_family"] != "Darwin"
    - not external_monaspace_dir.stat.exists

- name: Extract Monaspace fonts (Linux)
  ansible.builtin.unarchive:
    src: /tmp/monaspace.zip
    dest: "{{ xdg_data_home }}/fonts/Monaspace"
    remote_src: true
    extra_opts: ["--strip-components=1"]
  notify: Refresh font cache
  when:
    - ansible_facts["os_family"] != "Darwin"
    - not external_monaspace_dir.stat.exists

- name: Check if Claude Code is installed
  ansible.builtin.stat:
    path: "{{ local_bin }}/claude-code"
  register: external_claude_code

- name: Install Claude Code
  ansible.builtin.shell:
    cmd: curl -fsSL https://claude.ai/install.sh | bash
  args:
    executable: /bin/bash
  when: not external_claude_code.stat.exists

- name: Check if Codex CLI is installed
  ansible.builtin.stat:
    path: "{{ local_bin }}/codex"
  register: external_codex

- name: Install Codex CLI
  ansible.builtin.shell:
    cmd: curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 sh
  args:
    executable: /bin/bash
  when: not external_codex.stat.exists

- name: Check if uv is installed
  ansible.builtin.stat:
    path: "{{ local_bin }}/uv"
  register: external_uv

- name: Install uv
  ansible.builtin.shell:
    cmd: curl -LsSf https://astral.sh/uv/install.sh | sh
  args:
    executable: /bin/bash
  when: not external_uv.stat.exists

- name: Check if OpenCode is installed
  ansible.builtin.stat:
    path: "{{ local_bin }}/opencode"
  register: external_opencode

- name: Install OpenCode
  ansible.builtin.shell:
    cmd: curl -fsSL https://opencode.ai/install | bash
  args:
    executable: /bin/bash
  when: not external_opencode.stat.exists

- name: Check if Raycast Beta is installed
  ansible.builtin.stat:
    path: "/Applications/Raycast Beta.app"
  register: external_raycast_beta

- name: Uninstall Raycast v1 if present
  ansible.builtin.command:
    cmd: brew uninstall --cask raycast
  register: external_raycast_remove
  changed_when: "'Successfully uninstalled' in external_raycast_remove.stderr"
  failed_when: false
  when:
    - ansible_facts['os_family'] == "Darwin"
    - not external_raycast_beta.stat.exists

- name: Download Raycast Beta DMG
  ansible.builtin.get_url:
    url: "{{ raycast_beta_dmg_url }}"
    dest: /tmp/Raycast_Beta.dmg
    mode: "0644"
  when:
    - ansible_facts['os_family'] == "Darwin"
    - not external_raycast_beta.stat.exists

- name: Install Raycast Beta
  ansible.builtin.command:
    cmd: |
      hdiutil attach /tmp/Raycast_Beta.dmg -nobrowse -quiet &&
      cp -R "/Volumes/Raycast Beta/Raycast Beta.app" /Applications/ &&
      hdiutil detach "/Volumes/Raycast Beta" -quiet
  args:
    executable: /bin/bash
  when:
    - ansible_facts['os_family'] == "Darwin"
    - not external_raycast_beta.stat.exists
